<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taniya Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #fce7f3);
            text-align: center;
        }

        h1 {
            margin-top: 60px;
        }

        .subtitle {
            color: #555;
        }

        /* CARDS */
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 50px 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .label {
            margin-top: 10px;
            font-weight: 600;
        }

        /* MOBILE */
        @media(max-width:768px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>TANIYA GARIYA</h1>
    <p class="subtitle">Presentation Designer & Visual Storyteller</p>

    <div class="container">

        <div class="card" onclick="location.href='presentations.html'">
            <img src="./images/ppt_Cover.avif">
            <div class="label">PRESENTATIONS</div>
        </div>

        <div class="card" onclick="location.href='animations.html'">
            <img src="./images/Animation_Cover.avif">
            <div class="label">ANIMATION</div>
        </div>

    </div>

</body>

</html>
